<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자기소개</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:420px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
}

.header{
    background:#4f46e5;
    color:white;
    text-align:center;
    padding:30px;
}

.profile{
    width:120px;
    height:120px;
    border-radius:50%;
    border:5px solid white;
    margin-bottom:15px;
}

.header h1{
    font-size:28px;
}

.header p{
    opacity:0.9;
}

.content{
    padding:30px;
}

.section{
    margin-bottom:25px;
}

.section h2{
    color:#4f46e5;
    margin-bottom:10px;
    border-left:5px solid #4f46e5;
    padding-left:10px;
}

.section p{
    color:#555;
    line-height:1.6;
}

.skills{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.skill{
    background:#eef2ff;
    color:#4338ca;
    padding:8px 15px;
    border-radius:20px;
    font-size:14px;
}

.contact{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.footer{
    background:#f5f5f5;
    text-align:center;
    padding:15px;
    color:#666;
}
</style>

</head>
<body>

<div class="card">

    <div class="header">
        <img src="https://via.placeholder.com/120" class="profile">
        <h1>최문기</h1>
        <p>AI Developer</p>
    </div>

    <div class="content">

        <div class="section">
            <h2>👋 자기소개</h2>
            <p>
                안녕하세요! 인공지능과 게임 개발에 관심이 있는 개발자입니다.
                새로운 기술을 배우고 프로젝트를 만드는 것을 좋아합니다.
            </p>
        </div>

        <div class="section">
            <h2>💻 기술 스택</h2>

            <div class="skills">
                <div class="skill">Python</div>
                <div class="skill">C++</div>
                <div class="skill">Unity</div>
                <div class="skill">HTML</div>
                <div class="skill">CSS</div>
                <div class="skill">JavaScript</div>
            </div>

        </div>

        <div class="section">
            <h2>📧 연락처</h2>

            <div class="contact">
                <span>📩 youandstar1@naver.com</span>
                <span>🌐 github.com/TheNamul</span>
            </div>

        </div>

    </div>

    <div class="footer">
        © 2026 My Portfolio
    </div>

</div>

</body>
</html>
